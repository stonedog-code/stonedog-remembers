[project]
name = "stonedog-remembers"
version = "0.3.1"
description = "State management library for Python (async StonedogRemembers + synchronous Store)"
authors = [
    {name = "Jesse Stone",email = "jesse@stonedogcode.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "stonedog_remembers.py", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^5.0.0"
blank = "^0.1.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"

[tool.pytest.ini_options]
addopts = "-ra -q --cov=stonedog_remembers --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["stonedog_remembers"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | \.hypothesis
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
